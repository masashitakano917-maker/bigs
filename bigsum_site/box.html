<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rakubo | BigSum</title>
  <link rel="stylesheet" href="./subpage.css">
</head>
<body>
  <div data-site-header></div>
  <main>
    <div class="breadcrumb"><a href="./index.html">TOP</a> / 宅配ボックス購入</div>
    <section class="page-hero">
      <p class="page-kicker">Rakubo</p>
      <h1>受け取りを、もっとスマートに。</h1>
      <p>再配達を減らし、暮らしにゆとりを。玄関になじむシンプルな宅配ボックスです。</p>
    </section>
    <section class="page-section" id="about">
      <div class="product-layout">
        <img src="./assets/rakubo.jpg" alt="玄関前に設置された簡易型宅配ボックス Rakubo">
        <div>
          <p class="section-label">Rakubo</p>
          <h2>留守でも、<br>安心して受け取れる。</h2>
          <p class="body-copy">大容量・シンプル操作・住宅になじむデザイン。日々の受け取りをスムーズにし、配送ドライバーの再配達負担も減らします。</p>
          <a class="black-button pdf-button" href="./assets/rakubo.pdf" target="_blank" rel="noopener">商品詳細を見る →</a>
        </div>
      </div>
    </section>
    <section class="page-section alt" id="inquiry">
      <p class="section-label">CONTACT</p>
      <h2>商品購入のお問い合わせ</h2>
      <p class="body-copy purchase-intro">購入希望数やご希望の納期などをご入力ください。内容を確認のうえ、担当者よりご案内します。</p>
      <form class="purchase-form" id="purchase-form" data-contact-form="purchase">
        <div class="form-row">
          <label for="purchase-name">お名前</label>
          <input id="purchase-name" name="name" autocomplete="name" maxlength="100" required>
        </div>
        <div class="form-row">
          <label for="purchase-email">メールアドレス</label>
          <input id="purchase-email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="form-row">
          <label for="purchase-quantity">購入希望数</label>
          <input id="purchase-quantity" name="quantity" type="number" min="1" max="9999" step="1" value="1" inputmode="numeric" required>
        </div>
        <div class="form-row">
          <label for="purchase-message">ご要望・ご質問</label>
          <textarea id="purchase-message" name="message" maxlength="4000" placeholder="ご希望の納期、商品についてのご質問などをご入力ください。"></textarea>
        </div>
        <div class="form-trap" aria-hidden="true">
          <label for="purchase-company">会社名</label>
          <input id="purchase-company" name="company" tabindex="-1" autocomplete="off">
        </div>
        <label class="form-check">
          <input type="checkbox" required>
          <span><a class="text-link" href="./privacy.html">プライバシーポリシー</a>に同意する</span>
        </label>
        <button class="black-button" type="submit">送信する →</button>
        <p class="form-message" id="purchase-message-result" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="./site.js"></script>
  <script src="./form.js"></script>
</body>
</html>
