<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>お問い合わせ | BigSum</title>
  <link rel="stylesheet" href="./subpage.css">
</head>
<body>
  <div data-site-header></div>
  <main>
    <div class="breadcrumb"><a href="./index.html">TOP</a> / お問い合わせ</div>
    <section class="page-hero">
      <p class="page-kicker">CONTACT</p>
      <h1>まずは、お気軽にご相談ください。</h1>
      <p>配送サービス、採用、Rakuboについて、内容を確認のうえ担当者よりご案内します。</p>
    </section>
    <section class="page-section">
      <div class="contact-grid">
        <aside class="contact-note">
          <h2>お問い合わせ前に</h2>
          <p>お急ぎの配送相談は、希望日時・荷物量・集荷先・お届け先を添えるとスムーズです。</p>
        </aside>
        <form id="contact-form" data-contact-form="general">
          <div class="form-row">
            <label for="type">お問い合わせ種別</label>
            <select id="type" name="type" required>
              <option value="">選択してください</option>
              <option value="business">配送サービス</option>
              <option value="recruit">採用について</option>
              <option value="box">Rakubo</option>
              <option value="other">その他</option>
            </select>
          </div>
          <div class="form-row">
            <label for="name">お名前</label>
            <input id="name" name="name" autocomplete="name" maxlength="100" required>
          </div>
          <div class="form-row">
            <label for="email">メールアドレス</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          </div>
          <div class="form-row">
            <label for="message">お問い合わせ内容</label>
            <textarea id="message" name="message" maxlength="4000" required></textarea>
          </div>
          <div class="form-trap" aria-hidden="true">
            <label for="company">会社名</label>
            <input id="company" name="company" tabindex="-1" autocomplete="off">
          </div>
          <label class="form-check">
            <input type="checkbox" required>
            <span><a class="text-link" href="./privacy.html">プライバシーポリシー</a>に同意する</span>
          </label>
          <button class="black-button" type="submit">送信する →</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="./site.js"></script>
  <script>
    const p = new URLSearchParams(location.search).get("type") || "";
    const s = document.querySelector("#type");
    if (p.startsWith("recruit")) s.value = "recruit";
    else if (p.startsWith("box")) s.value = "box";
    else if (["business", "personal", "spot", "charter"].includes(p)) s.value = "business";
  </script>
  <script src="./form.js"></script>
</body>
</html>
